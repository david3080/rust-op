name: Deploy

# main への push でのみ起動する。pull_request では絶対に起動しない
# （公開リポジトリのため、フォークからの PR に WIF 認証情報を渡さないことが重要）。
on:
  push:
    branches: [main]

# 連続 push でジョブが並行動作すると、promote 承認待ちの間に後続 push が staging を
# 上書きし、レビュアーが確認したものと違うビルドが昇格されうる。キューイングして
# 常に1本ずつ処理する（実行中のものを kill はしない）。
concurrency:
  group: rust-op-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: fido2-8b943
  REGION: asia-northeast1
  # 非機密の識別子。リポジトリの Settings > Secrets and variables > Actions > Variables で管理。
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Test
        run: cargo test --locked

  # rust-op-staging (test.sonrisa.co.jp) へ100%トラフィックでビルド+デプロイし、
  # 機械的なスモークテストを行う。WebAuthn/passkeyの実機確認は人間がこのURLに対して行う
  # （promote の手動承認ゲートが、それが済んだことの証跡になる）。
  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      staging_image: ${{ steps.deploy.outputs.staging_image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: deploy
        run: |
          set -euo pipefail
          # コマンド置換で丸ごと出力を溜め込むと、失敗時にgcloudのビルドログ等が
          # CIログへ一切出ないままステップが落ちるため、tee で流しつつ抽出する。
          bash scripts/deploy_staging.sh --apply | tee /tmp/deploy_staging.log
          echo "staging_image=$(grep '^STAGING_IMAGE=' /tmp/deploy_staging.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Cleanup old images and revisions
        run: bash scripts/cleanup_cloud_run.sh --apply

  # 本番昇格。production Environment の Required reviewers による手動承認を
  # 通過するまで実行されない（passkey ログインの実機確認は staging 側で人手が行う）。
  # 再ビルドはせず、staging で検証済みのイメージをそのまま本番へ、本番の(入れ替え前の)
  # イメージをそのまま staging へデプロイする（scripts/promote.sh）。
  promote:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Promote staging image to production, swap previous production onto staging
        run: |
          bash scripts/promote.sh --apply --staging-image "${{ needs.deploy-staging.outputs.staging_image }}"

      - name: Cleanup old images and revisions
        run: bash scripts/cleanup_cloud_run.sh --apply
